name: Apply live steering fix

on:
  push:
    branches:
      - fix/live-codex-steering-regular-only

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/live-codex-steering-regular-only
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python3 scripts/apply-live-steering-fix.py
          python3 scripts/fix-live-steering-patch-output.py
          python3 scripts/fix-live-steering-handoff-ownership.py
          python3 scripts/fix-live-steering-browser-only-reuse.py
          python3 scripts/fix-regular-only-launcher-tests.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Verify source and runtime contracts
        shell: bash
        run: |
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-live-steering-fix.yml scripts/apply-live-steering-fix.py scripts/fix-live-steering-patch-output.py scripts/fix-live-steering-handoff-ownership.py scripts/fix-live-steering-browser-only-reuse.py scripts/fix-regular-only-launcher-tests.py
          git add -A
          git commit -m "fix: forward Codex steering into live web conversations"
          git push origin HEAD:fix/live-codex-steering-regular-only
