          old_conversation = '''    const conversationKey = !parsed._compactionRequest\n      && parsed.modelId !== CHATGPT_WEB_LUNA_MODEL_ID\n      && mode.localTools\n      && retainedLauncherDescriptor\n      ? chatGptConversationKey(checkpointInput.parsed, executionNamespace)\n      : undefined;\n    const resumeInput = conversationKey\n      ? retainedConversationResumeRequest(checkpointInput.parsed)\n      : undefined;\n    const retainConversation = conversationKey !== undefined;\n    const releaseRetainedConversation = conversationKey && retainedLauncherDescriptor\n      ? async () => {\n        await releaseLauncherRetainedConversation(retainedLauncherDescriptor, conversationKey);\n      }\n      : undefined;'''
          new_conversation = '''    const conversationKey = !parsed._compactionRequest\n      && retainedLauncherDescriptor\n      ? chatGptConversationKey(checkpointInput.parsed, executionNamespace)\n      : undefined;\n    if (steeringConversationKey && steeringConversationKey !== conversationKey) {\n      throw new Error("ChatGPT steering revision changed browser conversation identity");\n    }\n    const resumeInput = conversationKey\n      ? steeringConversationKey\n        ? retainedConversationSteeringRequest(checkpointInput.parsed)\n        : retainedConversationResumeRequest(checkpointInput.parsed)\n      : undefined;\n    if (steeringConversationKey && !resumeInput) {\n      throw new Error("ChatGPT steering revision has no user instruction to resume");\n    }\n    const retainConversation = conversationKey !== undefined && mode.localTools;\n    const releaseRetainedConversation = retainConversation && conversationKey && retainedLauncherDescriptor\n      ? async () => {\n        await releaseLauncherRetainedConversation(retainedLauncherDescriptor, conversationKey);\n      }\n      : undefined;'''
          text = replace_once(text, old_conversation, new_conversation, "adapter conversation ownership")

          lifecycle_marker = '''    const submissionLifecycle = parsed._compactionRequest ? {} : {\n      onSendActivated: () => { submission.phase = "send_activated" as const; },\n      onSubmitted: () => { submission.phase = "accepted" as const; },\n    };'''
          steering_helper = lifecycle_marker + '''\n    const steeringHandoffFor = (cancelBrowser: () => void): (() => Promise<string>) | undefined => (\n      conversationKey && retainedLauncherDescriptor\n        ? async () => {\n          if (submission.phase !== "accepted") {\n            throw new ChatGptWebAdapterError(\n              "Codex steering arrived before ChatGPT had accepted the active prompt; refusing an ambiguous browser handoff.",\n              { status: 409, errorType: "invalid_request_error", code: "steering_handoff_ambiguous", retryable: true },\n            );\n          }\n          await handoffLauncherTurnForSteering(retainedLauncherDescriptor, {\n            traceId,\n            helperPid: process.pid,\n            conversationKey,\n            connectorBound: mode.localTools,\n          });\n          cancelBrowser();\n          return conversationKey;\n        }\n        : undefined\n    );'''
          text = replace_once(text, lifecycle_marker, steering_helper, "adapter steering handoff helper")

          old_readonly_prepare = '''        prepare: async () => ({\n          ...compileChatGptWebPrompt(\n            checkpointInput.parsed,\n            turnCapabilities,\n            undefined,\n            compileOptionsFor(checkpointInput.parsed),\n          ),\n          release: () => {},\n        }),\n        abortSignal: browserAbort.signal,'''
          new_readonly_prepare = '''        prepare: async () => ({\n          ...compileChatGptWebPrompt(\n            checkpointInput.parsed,\n            turnCapabilities,\n            undefined,\n            compileOptionsFor(checkpointInput.parsed),\n          ),\n          release: () => {},\n        }),\n        ...(resumeInput ? {\n          prepareResume: async () => ({\n            ...compileChatGptWebPrompt(\n              resumeInput,\n              turnCapabilities,\n              undefined,\n              compileOptionsFor(resumeInput),\n            ),\n            release: () => {},\n          }),\n        } : {}),\n        ...(conversationKey ? { conversationKey } : {}),\n        ...(steeringConversationKey ? { requireRetainedConversation: true } : {}),\n        abortSignal: browserAbort.signal,'''
          text = replace_once(text, old_readonly_prepare, new_readonly_prepare, "read-only steering browser preparation")

          old_readonly_return = '''        usageInput: checkpointInput.parsed,\n        submission,\n        cancel: browserTurn.cancel,\n      };'''
          new_readonly_return = '''        usageInput: checkpointInput.parsed,\n        ...(identity.turnId ? { turnId: identity.turnId } : {}),\n        ...(conversationKey ? { conversationKey } : {}),\n        ...(steeringHandoffFor(() => browserTurn.cancel()) ? {\n          handoffForSteering: steeringHandoffFor(() => browserTurn.cancel()),\n        } : {}),\n        submission,\n        cancel: browserTurn.cancel,\n      };'''
          text = replace_once(text, old_readonly_return, new_readonly_return, "read-only steering runtime")

          text = replace_once(
              text,
              '''      ...(retainConversation ? { retainConversation: true, conversationKey } : {}),\n      abortSignal: browserAbort.signal,''',
              '''      ...(retainConversation ? { retainConversation: true, conversationKey } : conversationKey ? { conversationKey } : {}),\n      ...(steeringConversationKey ? { requireRetainedConversation: true } : {}),\n      abortSignal: browserAbort.signal,''',
              "tool steering retained requirement",
          )

          old_tools_return = '''      usageInput: checkpointInput.parsed,\n      ...(conversationKey ? { conversationKey } : {}),\n      ...(releaseRetainedConversation ? { releaseRetainedConversation } : {}),\n      retireCapability: async () => {'''
          new_tools_return = '''      usageInput: checkpointInput.parsed,\n      ...(identity.turnId ? { turnId: identity.turnId } : {}),\n      ...(conversationKey ? { conversationKey } : {}),\n      ...(releaseRetainedConversation ? { releaseRetainedConversation } : {}),\n      ...(steeringHandoffFor(() => browserTurn.cancel()) ? {\n        handoffForSteering: steeringHandoffFor(() => browserTurn.cancel()),\n      } : {}),\n      retireCapability: async () => {'''
          text = replace_once(text, old_tools_return, new_tools_return, "tool steering runtime")

          old_session = '''        const session = await chatGptTurnSessions.getOrCreateAfterOwnerRetirement(\n          executionKey,\n          ownerKey,\n          () => startRuntime(parsed, environment, traceId, turnCapabilities),\n          traceId,\n          incoming.abortSignal,\n        );'''
          new_session = '''        const identity = extractChatGptTurnIdentity(parsed);\n        const steeringConversationKey = identity.turnId\n          ? await chatGptTurnSessions.handoffActiveOwnerForSteering(\n            ownerKey,\n            identity.turnId,\n            executionKey,\n            incoming.abortSignal,\n          )\n          : undefined;\n        const session = await chatGptTurnSessions.getOrCreateAfterOwnerRetirement(\n          executionKey,\n          ownerKey,\n          () => startRuntime(parsed, environment, traceId, turnCapabilities, steeringConversationKey),\n          traceId,\n          incoming.abortSignal,\n        );'''
          text = replace_once(text, old_session, new_session, "adapter steering session selection")
          write(path, text)

          # Keep helper-facing session evidence aligned with regular-only launcher semantics.
          for path in ["tests/launcher-browser-host.test.ts", "tests/browser-worker-contract.test.ts", "tests/chatgpt-web-harness.test.ts", "launcher/tests/runtime-host.test.cjs"]:
              p = Path(path)
              if not p.exists():
                  continue
              t = p.read_text()
              t = t.replace("temporary: true", "regular: true")
              t = t.replace("temporary: false", "regular: false")
              t = t.replace(".temporary", ".regular")
              t = t.replace("isTemporaryChatUrl", "isRegularChatUrl")
              p.write_text(t)

          # No runtime path may intentionally request Temporary Chat anymore.
          functional = [
              Path("src/chatgpt-session.ts"),
              Path("src/adapters/chatgpt-web/browser-worker.ts"),
              Path("launcher/electron/browser-host.cjs"),
              Path("src/launcher-browser-host.ts"),
          ]
          for p in functional:
              if "temporary-chat=true" in p.read_text():
                  raise SystemExit(f"{p}: still contains temporary-chat=true")
          PY

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Verify
        run: bun run verify
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-live-steering-fix.yml
          git add -A
          git commit -m "fix: forward Codex steering into live web conversations"
          git push origin HEAD:fix/live-codex-steering-regular-only
