name: Apply live steering fix

on:
  push:
    branches:
      - fix/live-codex-steering-regular-only

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/live-codex-steering-regular-only
          fetch-depth: 0
      - name: Apply source patch
        run: python3 scripts/apply-live-steering-fix.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Verify
        run: bun run verify
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-live-steering-fix.yml scripts/apply-live-steering-fix.py
          git add -A
          git commit -m "fix: forward Codex steering into live web conversations"
          git push origin HEAD:fix/live-codex-steering-regular-only
