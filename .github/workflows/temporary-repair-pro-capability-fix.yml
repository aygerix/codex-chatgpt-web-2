name: Temporary repair Pro capability fix

on:
  push:
    branches:
      - fix/repair-capability-structural-personalization

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/repair-capability-structural-personalization
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Patch repair capability probe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:180]!r}")
              p.write_text(text.replace(old, new, 1))

          path = "src/adapters/chatgpt-web/browser-worker.ts"
          once(path,
          '''  private async inspectSessionExclusive(detectCapabilities: boolean): Promise<{\n    authenticated: true;\n    temporary: true;\n    url: string;\n    solAvailable?: boolean;\n    proAvailable?: boolean;\n  }> {\n    const page = await this.ensurePage();\n    await this.prepareTemporaryChatSurface(page);\n    const url = page.url();\n    if (!detectCapabilities) return { authenticated: true, temporary: true, url };\n    // Account/model installation must inspect the same Personalized Temporary Chat surface that\n    // exposes Pro-only effort levels. Ordinary browser-only turns intentionally do not require\n    // this control; this preflight is scoped only to explicit capability detection.\n    await ensureChatGptPersonalizedConnectorAccess(page);\n    const capabilities = await detectChatGptAccountCapabilities(page);\n    return { authenticated: true, temporary: true, url, ...capabilities };\n  }''',
          '''  private async detectSetupAccountCapabilities(page: Page) {\n    const initial = await detectChatGptAccountCapabilities(page);\n    if (!initial.solAvailable || initial.proAvailable) return initial;\n\n    // A Pro account can expose only the three non-Pro effort positions while a Temporary Chat is\n    // in the other personalization state, and ChatGPT does not reliably render the labeled\n    // Personalized/Unpersonalized button. Probe the structural two-state control instead: flip it,\n    // rescan the effort surface, and keep the flipped state only when that objectively reveals the\n    // five-position Pro catalog. If it does not, restore the exact original state before returning.\n    const deadline = Date.now() + CHATGPT_PERSONALIZATION_PREFLIGHT_TIMEOUT_MS;\n    const controller = new AbortController();\n    const timer = setTimeout(() => controller.abort(), Math.max(1, deadline - Date.now()));\n    timer.unref?.();\n    let receipt: ChatGptPersonalizationToggleReceipt | undefined;\n    try {\n      receipt = await toggleChatGptPersonalizationChoice(page, deadline, controller.signal);\n      const toggled = await detectChatGptAccountCapabilities(page);\n      if (toggled.solAvailable && toggled.proAvailable) return toggled;\n      await restoreChatGptPersonalizationChoice(page, receipt);\n      receipt = undefined;\n      return initial;\n    } catch (error) {\n      if (receipt) {\n        try {\n          await restoreChatGptPersonalizationChoice(page, receipt);\n        } catch (restoreError) {\n          throw new ChatGptPersistentBrowserStateError(\n            [error, restoreError],\n            "ChatGPT setup capability probe failed and its personalization state could not be restored",\n          );\n        }\n      }\n      throw error;\n    } finally {\n      clearTimeout(timer);\n    }\n  }\n\n  private async inspectSessionExclusive(detectCapabilities: boolean): Promise<{\n    authenticated: true;\n    temporary: true;\n    url: string;\n    solAvailable?: boolean;\n    proAvailable?: boolean;\n  }> {\n    const page = await this.ensurePage();\n    await this.prepareTemporaryChatSurface(page);\n    const url = page.url();\n    if (!detectCapabilities) return { authenticated: true, temporary: true, url };\n    const capabilities = await this.detectSetupAccountCapabilities(page);\n    return { authenticated: true, temporary: true, url, ...capabilities };\n  }''')

          path = "tests/browser-worker-contract.test.ts"
          p = Path(path)
          text = p.read_text()
          old = '''  const inspectSessionExclusive = workerSource.slice(\n    workerSource.indexOf("  private async inspectSessionExclusive("),\n    workerSource.indexOf("  private async smokeTestExclusive("),\n  );\n  const capabilityPersonalization = inspectSessionExclusive.indexOf(\n    "await ensureChatGptPersonalizedConnectorAccess(page);",\n  );\n  const capabilityDetection = inspectSessionExclusive.indexOf(\n    "await detectChatGptAccountCapabilities(page);",\n  );\n  expect(capabilityPersonalization).toBeGreaterThan(-1);\n  expect(capabilityDetection).toBeGreaterThan(capabilityPersonalization);'''
          new = '''  const setupCapabilityProbe = workerSource.slice(\n    workerSource.indexOf("  private async detectSetupAccountCapabilities("),\n    workerSource.indexOf("  private async inspectSessionExclusive("),\n  );\n  expect(setupCapabilityProbe).toContain("const initial = await detectChatGptAccountCapabilities(page)");\n  expect(setupCapabilityProbe).toContain("await toggleChatGptPersonalizationChoice(page, deadline, controller.signal)");\n  expect(setupCapabilityProbe).toContain("const toggled = await detectChatGptAccountCapabilities(page)");\n  expect(setupCapabilityProbe).toContain("if (toggled.solAvailable && toggled.proAvailable) return toggled");\n  expect(setupCapabilityProbe).toContain("await restoreChatGptPersonalizationChoice(page, receipt)");\n  expect(setupCapabilityProbe).not.toContain("ensureChatGptPersonalizedConnectorAccess(");\n  const inspectSessionExclusive = workerSource.slice(\n    workerSource.indexOf("  private async inspectSessionExclusive("),\n    workerSource.indexOf("  private async smokeTestExclusive("),\n  );\n  expect(inspectSessionExclusive).toContain("await this.detectSetupAccountCapabilities(page)");\n  expect(inspectSessionExclusive).not.toContain("ensureChatGptPersonalizedConnectorAccess(");'''
          if text.count(old) != 1:
              raise SystemExit(f"{path}: capability regression block occurrence={text.count(old)}")
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Validate exact patched tree
        run: |
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temporary-repair-pro-capability-fix.yml
          git add src/adapters/chatgpt-web/browser-worker.ts tests/browser-worker-contract.test.ts
          git commit -m "Probe Pro capability through structural personalization state"
          git push origin HEAD:fix/repair-capability-structural-personalization
