name: Temporary DOM range fix gate

on:
  push:
    branches:
      - fix/nonmonotonic-final-dom-ranges

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run check-version
      - run: bun run typecheck
      - run: bun run test
      - run: bun run launcher:typecheck
      - run: bun run launcher:test
      - run: bun run launcher:build
      - run: bun run build
      - run: bun run smoke
