name: Temporary native goal experiment
on:
  push:
    branches:
      - experiment/native-goal-turn-scoped-capabilities
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Patch native goal capability epoch
        run: python3 .github/scripts/patch-native-goal-turn-scope.py
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Validate experiment
        run: |
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit validated experiment
        run: |
          rm .github/workflows/temporary-native-goal-experiment.yml
          rm .github/scripts/patch-native-goal-turn-scope.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/adapters/chatgpt-web/conversation-key.ts src/adapters/chatgpt-web/index.ts tests/chatgpt-goal-capability-epoch.test.ts .github/workflows/temporary-native-goal-experiment.yml .github/scripts/patch-native-goal-turn-scope.py
          git commit -m "Prototype native goal turn-scoped capabilities"
          git push
