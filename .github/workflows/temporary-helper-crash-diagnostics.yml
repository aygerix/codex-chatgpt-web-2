name: Temporary helper crash diagnostics

on:
  push:
    branches:
      - experiment/native-goal-turn-scoped-capabilities

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Patch helper crash diagnostics
        run: python3 .github/scripts/patch-helper-crash-diagnostics.py
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Validate exact experiment
        run: |
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit validated diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/adapters/chatgpt-web/browser-helper-main.ts src/adapters/chatgpt-web/launcher-helper-client.ts tests/helper-crash-diagnostics.test.ts
          git commit -m 'Preserve browser helper crash diagnostics'
          git push origin HEAD:experiment/native-goal-turn-scoped-capabilities
