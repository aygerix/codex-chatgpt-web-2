name: Temporary submission acceptance race

on:
  push:
    branches:
      - experiment/native-goal-turn-scoped-capabilities

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Patch submission acceptance race
        run: python3 .github/scripts/patch-submission-acceptance-race.py
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Validate race regression
        run: |
          bun test tests/browser-worker-contract.test.ts
          bun run check-version
          bun run typecheck
          bun run test
          bun run build
          bun run smoke
      - name: Commit validated submission acceptance recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/adapters/chatgpt-web/browser-worker.ts tests/browser-worker-contract.test.ts
          git commit -m 'Recover submission acceptance from stalled DOM probes'
          git push origin HEAD:experiment/native-goal-turn-scoped-capabilities
