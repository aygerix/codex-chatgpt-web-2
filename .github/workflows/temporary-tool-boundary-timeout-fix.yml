name: Temporary tool-boundary timeout fix
on:
  push:
    branches:
      - fix/tool-boundary-recovery-aware-timeout
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Patch tool-boundary timeout
        run: python3 .github/scripts/patch-tool-boundary-timeout.py
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Validate exact patched tree
        run: |
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit validated implementation
        run: |
          rm .github/workflows/temporary-tool-boundary-timeout-fix.yml
          rm .github/scripts/patch-tool-boundary-timeout.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/adapters/chatgpt-web/turn-progress.ts tests/turn-progress.test.ts .github/workflows/temporary-tool-boundary-timeout-fix.yml .github/scripts/patch-tool-boundary-timeout.py
          git commit -m "Align tool-boundary timeout with browser recovery"
          git push
