name: Temporary Pro capability probe fix

on:
  push:
    branches:
      - fix/pro-capability-personalized-probe

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pro-capability-personalized-probe
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Patch capability inspection personalization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:180]!r}")
              p.write_text(text.replace(old, new, 1))

          once(
              "src/adapters/chatgpt-web/browser-worker.ts",
              '''    const url = page.url();\n    if (!detectCapabilities) return { authenticated: true, temporary: true, url };\n    const capabilities = await detectChatGptAccountCapabilities(page);\n    return { authenticated: true, temporary: true, url, ...capabilities };''',
              '''    const url = page.url();\n    if (!detectCapabilities) return { authenticated: true, temporary: true, url };\n    // Account/model installation must inspect the same Personalized Temporary Chat surface that\n    // exposes Pro-only effort levels. Ordinary browser-only turns intentionally do not require\n    // this control; this preflight is scoped only to explicit capability detection.\n    await ensureChatGptPersonalizedConnectorAccess(page);\n    const capabilities = await detectChatGptAccountCapabilities(page);\n    return { authenticated: true, temporary: true, url, ...capabilities };''',
          )

          path = "tests/browser-worker-contract.test.ts"
          p = Path(path)
          text = p.read_text()
          marker = '''  expect(workerSource).toContain("__CODEX_WEB_GPT_STEER_REVISION__");'''
          inserted = '''  const inspectSessionExclusive = workerSource.slice(\n    workerSource.indexOf("  private async inspectSessionExclusive("),\n    workerSource.indexOf("  private async smokeTestExclusive("),\n  );\n  const capabilityPersonalization = inspectSessionExclusive.indexOf(\n    "await ensureChatGptPersonalizedConnectorAccess(page);",\n  );\n  const capabilityDetection = inspectSessionExclusive.indexOf(\n    "await detectChatGptAccountCapabilities(page);",\n  );\n  expect(capabilityPersonalization).toBeGreaterThan(-1);\n  expect(capabilityDetection).toBeGreaterThan(capabilityPersonalization);\n'''
          if text.count(marker) != 1:
              raise SystemExit("browser-worker contract insertion marker not unique")
          p.write_text(text.replace(marker, inserted + marker, 1))
          PY
          git diff --check
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Validate exact patched tree
        run: |
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temporary-pro-capability-probe-fix.yml
          git add src/adapters/chatgpt-web/browser-worker.ts tests/browser-worker-contract.test.ts
          git commit -m "Probe Pro capabilities on Personalized Temporary Chat"
          git push origin HEAD:fix/pro-capability-personalized-probe
