name: Temporary token retirement fix

on:
  push:
    branches:
      - fix/defer-token-retirement-until-physical-settlement

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Patch token retirement race
        run: python3 .github/scripts/patch-token-retirement.py
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Validate exact patched tree
        run: |
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit validated implementation
        run: |
          rm .github/workflows/temporary-token-retirement-fix.yml
          rm .github/scripts/patch-token-retirement.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep turn capability alive through observer reconnects"
          git push
