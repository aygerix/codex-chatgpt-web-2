name: Temporary token retirement fix
on:
  push:
    branches:
      - fix/defer-token-retirement-until-physical-settlement
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Patch token retirement race
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/adapters/chatgpt-web/index.ts')
          s = p.read_text()
          old = '''          if (session.runtime.mode === "tools") {
            void session.runtime.token.then(turnToken => broker.revoke(turnToken)).catch(() => {});
          }
'''
          if old not in s:
            raise SystemExit('eager revoke block not found')
          s = s.replace(old, '''          // Do not revoke the turn capability here. A Responses/SSE observer can fail or reconnect
          // while the already-accepted browser turn is still alive and may still invoke Codex Native.
          // ChatGptTurnSession owns capability retirement and performs it only after physical browser
          // settlement plus all already-admitted observers have drained.
''', 1)
          p.write_text(s)

          tp = Path('tests/turn-broker-lifecycle.test.ts')
          ts = tp.read_text()
          if 'accepted browser turn keeps its tool capability across observer failure until physical settlement' not in ts:
            ts += r'''

test("accepted browser turn keeps its tool capability across observer failure until physical settlement", async () => {
  let resolvePhysical!: () => void;
  const physicalSettlement = new Promise<void>(resolve => { resolvePhysical = resolve; });
  let revoked = 0;
  const runtime = {
    mode: "tools" as const,
    browser: new Promise<string>(() => {}),
    physicalSettlement,
    trace: { drain: () => [], wait: async () => {} } as any,
    text: { drain: () => [], value: () => "", wait: async () => {} } as any,
    token: Promise.resolve("turn_token"),
    externalProgress: {} as any,
    retireCapability: async () => { revoked += 1; },
    cancel: () => {},
  };
  const session = new ChatGptTurnSession(runtime as any, "trace", "owner");

  await session.runExclusive(async () => {
    throw new Error("observer disconnected");
  }).catch(() => {});

  await Promise.resolve();
  expect(revoked).toBe(0);

  resolvePhysical();
  await physicalSettlement;
  await new Promise(resolve => setTimeout(resolve, 0));
  expect(revoked).toBe(1);
});
'''
          tp.write_text(ts)
          PY
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Validate exact patched tree
        run: |
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit validated implementation
        shell: bash
        run: |
          rm .github/workflows/temporary-token-retirement-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/adapters/chatgpt-web/index.ts tests/turn-broker-lifecycle.test.ts .github/workflows/temporary-token-retirement-fix.yml
          git commit -m "Keep turn capability alive through observer reconnects"
          git push
