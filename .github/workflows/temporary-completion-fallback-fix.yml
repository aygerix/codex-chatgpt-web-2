name: Temporary completion fallback fix

on:
  push:
    branches:
      - fix/completion-fallback-without-copy-action

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/completion-fallback-without-copy-action
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Patch completion fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/adapters/chatgpt-web/browser-worker.ts')
          s = p.read_text()

          def once(old, new):
              global s
              c = s.count(old)
              if c != 1:
                  raise SystemExit(f'expected one occurrence, found {c}: {old[:120]!r}')
              s = s.replace(old, new, 1)

          once(
          '''  completionActionVisible: boolean;\n}): boolean {\n  return state.responsePresent\n    && !state.running\n    && state.currentText.length > 0\n    && state.completionActionVisible;''',
          '''  completionActionVisible: boolean;\n  /** Explicit false is strong fallback evidence that ChatGPT has retired its streaming-status UI. */\n  streamingStatusVisible?: boolean;\n}): boolean {\n  return state.responsePresent\n    && !state.running\n    && state.currentText.length > 0\n    && (state.completionActionVisible || state.streamingStatusVisible === false);''')

          once(
          '''    completionActionVisible: boolean;\n    externalProgressLive?: boolean;''',
          '''    completionActionVisible: boolean;\n    streamingStatusVisible?: boolean;\n    externalProgressLive?: boolean;''')

          once(
          '''      && state.currentText.length > 0\n      && !state.completionActionVisible;''',
          '''      && state.currentText.length > 0\n      && !state.completionActionVisible\n      // Current ChatGPT can omit the Copy action entirely. A retired streaming-status surface is\n      // the structural fallback completion signal; only complain when streaming UI is still live\n      // or the caller did not provide that stronger observation.\n      && state.streamingStatusVisible !== false;''')

          once(
          '''  completionActionVisible: boolean;\n  stoppedThinkingVisible: boolean;''',
          '''  completionActionVisible: boolean;\n  streamingStatusVisible: boolean;\n  stoppedThinkingVisible: boolean;''')

          once(
          '''  completionActionVisible: false,\n  stoppedThinkingVisible: false,''',
          '''  completionActionVisible: false,\n  streamingStatusVisible: false,\n  stoppedThinkingVisible: false,''')

          once(
          '''          completionActionVisible: completionAction !== undefined,\n          stoppedThinkingVisible,''',
          '''          completionActionVisible: completionAction !== undefined,\n          streamingStatusVisible: streamingStatusContainers.length > 0,\n          stoppedThinkingVisible,''')

          # Two health tracker calls: present response and absent response.
          once(
          '''            completionActionVisible: snapshot.completionActionVisible,\n            externalProgressLive,''',
          '''            completionActionVisible: snapshot.completionActionVisible,\n            streamingStatusVisible: snapshot.streamingStatusVisible,\n            externalProgressLive,''')

          once(
          '''            completionActionVisible: false,\n            externalProgressLive,''',
          '''            completionActionVisible: false,\n            streamingStatusVisible: false,\n            externalProgressLive,''')

          once(
          '''            completionActionVisible: snapshot.completionActionVisible,\n            externalToolCallsInFlight,''',
          '''            completionActionVisible: snapshot.completionActionVisible,\n            streamingStatusVisible: snapshot.streamingStatusVisible,\n            externalToolCallsInFlight,''')

          p.write_text(s)

          test = Path('tests/chatgpt-completion-fallback.test.ts')
          test.write_text('''import { expect, test } from "bun:test";\nimport {\n  ChatGptCompletionTracker,\n  ChatGptTurnDomHealthTracker,\n  chatGptTurnIsComplete,\n} from "../src/adapters/chatgpt-web/browser-worker";\n\ntest("completion accepts stable stopped answer when streaming status is retired without Copy action", () => {\n  const state = {\n    responsePresent: true, running: false, currentText: "done", currentHtml: "<p>done</p>",\n    completionActionVisible: false, streamingStatusVisible: false,\n  };\n  expect(chatGptTurnIsComplete(state)).toBe(true);\n  const tracker = new ChatGptCompletionTracker(2_000);\n  expect(tracker.update(state, 1_000)).toBe(false);\n  expect(tracker.update(state, 3_001)).toBe(true);\n});\n\ntest("completion still waits when streaming status remains live and Copy action is absent", () => {\n  const state = {\n    responsePresent: true, running: false, currentText: "done", currentHtml: "<p>done</p>",\n    completionActionVisible: false, streamingStatusVisible: true,\n  };\n  expect(chatGptTurnIsComplete(state)).toBe(false);\n  const tracker = new ChatGptCompletionTracker(0);\n  expect(tracker.update(state, 1_000)).toBe(false);\n});\n\ntest("DOM health does not reject missing Copy action after streaming status retires", () => {\n  const tracker = new ChatGptTurnDomHealthTracker(60_000, 10_000, 1_000);\n  const retired = {\n    responsePresent: true, running: false, currentText: "done",\n    completionActionVisible: false, streamingStatusVisible: false,\n  };\n  expect(tracker.update(retired, 1_000)).toBeUndefined();\n  expect(tracker.update(retired, 5_000)).toBeUndefined();\n\n  const ambiguous = { ...retired, streamingStatusVisible: true };\n  expect(tracker.update(ambiguous, 6_000)).toBeUndefined();\n  expect(tracker.update(ambiguous, 7_001)).toContain("completed-turn action");\n});\n''')
          PY
          git diff --check
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Validate exact patched tree
        run: |
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temporary-completion-fallback-fix.yml
          git add src/adapters/chatgpt-web/browser-worker.ts tests/chatgpt-completion-fallback.test.ts
          git commit -m "Accept structural completion without Copy action"
          git push origin HEAD:fix/completion-fallback-without-copy-action
