name: Temporary live Codex steer implementation

on:
  push:
    branches:
      - fix/codex-steer-button-live-web

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/codex-steer-button-live-web
      - name: Patch live steer transport
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          # Authenticated daemon -> launcher immediate steer RPC and PR #4 Temporary Chat evidence.
          path = "src/launcher-browser-host.ts"
          p = Path(path)
          text = p.read_text()
          if text.count('body.regular !== true') != 1:
              raise SystemExit("launcher-browser-host.ts: stale regular evidence predicate not found")
          text = text.replace('body.regular !== true', 'body.temporary !== true', 1)
          anchor = '''export async function releaseLauncherRetainedConversation(\n'''
          if text.count(anchor) != 1:
              raise SystemExit("launcher-browser-host.ts: release anchor not found")
          steer = '''export const LAUNCHER_LIVE_STEER_TIMEOUT_MS = 15_000;\n\nexport async function steerLauncherTurn(\n  descriptorPath: string,\n  input: { traceId: string; logId: number; text: string },\n  timeoutMs = LAUNCHER_LIVE_STEER_TIMEOUT_MS,\n): Promise<{ revision: number; duplicate: boolean }> {\n  if (!/^[A-Za-z0-9_-]{6,128}$/.test(input.traceId)) throw new Error("Launcher steer trace id is invalid");\n  if (!Number.isSafeInteger(input.logId) || input.logId < 1) throw new Error("Launcher steer log id is invalid");\n  if (typeof input.text !== "string" || !input.text.trim()) throw new Error("Launcher steer text is empty");\n  const descriptor = readLauncherBrowserHostDescriptor(descriptorPath);\n  const controller = new AbortController();\n  const timer = setTimeout(() => controller.abort(), timeoutMs);\n  try {\n    const response = await fetch(`${descriptor.control.endpoint}/v1/turn/steer`, {\n      method: "POST",\n      headers: {\n        authorization: `Bearer ${descriptor.control.token}`,\n        "content-type": "application/json",\n      },\n      body: JSON.stringify(input),\n      signal: controller.signal,\n    });\n    const body = await response.json().catch(() => ({})) as Record<string, unknown>;\n    if (!response.ok || !Number.isSafeInteger(body.revision) || typeof body.duplicate !== "boolean") {\n      const detail = typeof body.error === "string" ? `: ${body.error}` : "";\n      throw new Error(`HTTP ${response.status}${detail}`);\n    }\n    return { revision: Number(body.revision), duplicate: body.duplicate };\n  } catch (error) {\n    throw new Error(`Launcher live steering failed: ${error instanceof Error ? error.message : String(error)}`);\n  } finally {\n    clearTimeout(timer);\n  }\n}\n\n'''
          text = text.replace(anchor, steer + anchor, 1)
          p.write_text(text)

          # Launcher control server accepts only authenticated /turn/steer and forwards to exact tab.
          path = "launcher/electron/control-server.cjs"
          p = Path(path)
          text = p.read_text()
          text = text.replace(
              'const { completeSteeringHandoff, requestSteeringHandoff } = require("./steering-handoff.cjs");',
              'const { completeSteeringHandoff, requestSteeringHandoff } = require("./steering-handoff.cjs");\nconst { steerRunningTurn } = require("./live-steering.cjs");',
              1,
          )
          text = text.replace('const MAX_BODY_BYTES = 16 * 1024;', 'const MAX_BODY_BYTES = 16 * 1024;\nconst MAX_STEER_BODY_BYTES = 256 * 1024;', 1)
          text = text.replace('async function readJson(request) {', 'async function readJson(request, maxBytes = MAX_BODY_BYTES) {', 1)
          text = text.replace('if (bytes > MAX_BODY_BYTES) throw new Error("request body is too large");', 'if (bytes > maxBytes) throw new Error("request body is too large");', 1)
          text = text.replace(
              '|| request.url === "/v1/turn/handoff"\n      || request.url === "/v1/turn/end";',
              '|| request.url === "/v1/turn/handoff"\n      || request.url === "/v1/turn/steer"\n      || request.url === "/v1/turn/end";',
              1,
          )
          text = text.replace(
              'const body = await readJson(request);',
              'const body = await readJson(request, request.url === "/v1/turn/steer" ? MAX_STEER_BODY_BYTES : MAX_BODY_BYTES);',
              1,
          )
          text = text.replace(
              'if (request.url !== "/v1/turn/handoff"\n        && (!Number.isInteger(body.helperPid) || body.helperPid < 1)) {',
              'if (request.url !== "/v1/turn/handoff"\n        && request.url !== "/v1/turn/steer"\n        && (!Number.isInteger(body.helperPid) || body.helperPid < 1)) {',
              1,
          )
          steer_branch_anchor = '''      const preferences = this.getPreferences();\n      if (request.url === "/v1/turn/handoff") {'''
          steer_branch = '''      const preferences = this.getPreferences();\n      if (request.url === "/v1/turn/steer") {\n        const receipt = await steerRunningTurn(host, {\n          traceId: body.traceId,\n          logId: body.logId,\n          text: body.text,\n        });\n        writeJson(response, 200, { ok: true, ...receipt });\n        return;\n      }\n      if (request.url === "/v1/turn/handoff") {'''
          if text.count(steer_branch_anchor) != 1:
              raise SystemExit("control-server.cjs: steer branch anchor not found")
          text = text.replace(steer_branch_anchor, steer_branch, 1)
          p.write_text(text)

          # Browser worker follows steer-created assistant turns on the same active Responses stream.
          path = "src/adapters/chatgpt-web/browser-worker.ts"
          p = Path(path)
          text = p.read_text()
          method_anchor = '''  private async waitForTurnDomMutation(page: Page, timeoutMs = 50): Promise<void> {'''
          methods = '''  private async readCodexSteerRevision(page: Page): Promise<number> {\n    return await page.evaluate(() => {\n      const value = (globalThis as typeof globalThis & { __CODEX_WEB_GPT_STEER_REVISION__?: unknown })\n        .__CODEX_WEB_GPT_STEER_REVISION__;\n      return Number.isSafeInteger(value) && Number(value) >= 0 ? Number(value) : 0;\n    }).catch(() => 0);\n  }\n\n  private async waitForSteeredAssistantTurn(\n    page: Page,\n    knownResponseIdentities: ReadonlySet<string>,\n    minimumNewResponses: number,\n    deadline: number | undefined,\n    signal?: AbortSignal,\n  ): Promise<{\n    binding: ChatGptAssistantTurnBinding;\n    baseline: ChatGptSubmissionBaseline;\n    state: ChatGptSubmissionDomState;\n  }> {\n    const responseDeadline = Math.min(\n      deadline ?? Number.POSITIVE_INFINITY,\n      Date.now() + CHATGPT_RESPONSE_DOM_GRACE_MS,\n    );\n    for (;;) {\n      if (signal?.aborted) throw new DOMException("ChatGPT web turn aborted", "AbortError");\n      if (page.isClosed()) throw chatGptBrowserTabClosedError();\n      if (deadline !== undefined && Date.now() >= deadline) throw new Error("ChatGPT web turn timed out");\n      if (Date.now() >= responseDeadline) {\n        throw new Error("ChatGPT accepted Codex steering but did not expose its steered assistant turn in the DOM");\n      }\n      const state = await this.submissionDomState(page, undefined, signal);\n      const newResponses = state.responseIdentities.filter(identity => !knownResponseIdentities.has(identity));\n      if (newResponses.length >= Math.max(1, minimumNewResponses)) {\n        const identity = newResponses.at(-1)!;\n        const initialResponseTurnIdentities = state.responseIdentities.filter(candidate => candidate !== identity);\n        const baseline: ChatGptSubmissionBaseline = {\n          userTurns: page.locator(CHATGPT_USER_TURN_SELECTOR),\n          responseTurns: page.locator(CHATGPT_ASSISTANT_TURN_SELECTOR),\n          initialUserTurnCount: Math.max(0, state.userTurnCount - 1),\n          initialResponseTurnCount: Math.max(0, state.assistantTurnCount - 1),\n          initialUserTurnIdentities: state.userIdentities.slice(0, -1),\n          initialResponseTurnIdentities,\n          domCache: {},\n        };\n        return {\n          state,\n          baseline,\n          binding: {\n            identity,\n            locator: page.locator(`[data-testid=${JSON.stringify(identity)}]`),\n            acceptedUserTurnIdentities: state.userIdentities,\n          },\n        };\n      }\n      await this.waitForTurnDomMutation(page, 50);\n    }\n  }\n\n'''
          if text.count(method_anchor) != 1:
              raise SystemExit("browser-worker.ts: method anchor not found")
          text = text.replace(method_anchor, methods + method_anchor, 1)

          declarations_old = '''      const completionTracker = new ChatGptCompletionTracker();'''
          text = text.replace(declarations_old, '      let completionTracker = new ChatGptCompletionTracker();', 1)
          block_old = '''      let lastHeartbeat = 0;\n      let finalText = "";\n      let sawRunning = false;\n      let loggedCompletionWait = false;\n      let capturedResponse = false;\n      const sentAt = Date.now();\n      const visibleTrace = new ChatGptVisibleTraceTracker();\n      const markdownBuffer = new ChatGptMarkdownBuffer();\n      const checkpointStream = turn.captureLunaCheckpoint\n        ? new ChatGptLunaCheckpointStream()\n        : undefined;\n      const emitMarkdownDelta = (delta: string): void => {\n        const visible = checkpointStream ? checkpointStream.push(delta) : delta;\n        if (visible) turn.onTextDelta(visible);\n      };'''
          block_new = '''      let lastHeartbeat = 0;\n      let finalText = "";\n      let sawRunning = false;\n      let loggedCompletionWait = false;\n      let capturedResponse = false;\n      let sentAt = Date.now();\n      let visibleTrace = new ChatGptVisibleTraceTracker();\n      let markdownBuffer = new ChatGptMarkdownBuffer();\n      let checkpointStream = turn.captureLunaCheckpoint\n        ? new ChatGptLunaCheckpointStream()\n        : undefined;\n      const completedSteerAnswers: string[] = [];\n      let pendingSteerSeparator = false;\n      let handledSteerRevision = await this.readCodexSteerRevision(page);\n      let knownResponseIdentities = new Set<string>([\n        ...submissionBaseline.initialResponseTurnIdentities,\n        responseTurn.identity,\n      ]);\n      const emitMarkdownDelta = (delta: string): void => {\n        const visible = checkpointStream ? checkpointStream.push(delta) : delta;\n        if (!visible) return;\n        if (pendingSteerSeparator) {\n          turn.onTextDelta("\\n\\n");\n          pendingSteerSeparator = false;\n        }\n        turn.onTextDelta(visible);\n      };'''
          if text.count(block_old) != 1:
              raise SystemExit("browser-worker.ts: response declaration block not found")
          text = text.replace(block_old, block_new, 1)
          text = text.replace('''      const domHealthTracker = new ChatGptTurnDomHealthTracker();\n      const stoppedThinkingTracker = new ChatGptStoppedThinkingTracker();\n      const responseDomCache: ChatGptResponseDomCache = {};''', '''      let domHealthTracker = new ChatGptTurnDomHealthTracker();\n      let stoppedThinkingTracker = new ChatGptStoppedThinkingTracker();\n      let responseDomCache: ChatGptResponseDomCache = {};\n      const applyCodexSteer = async (revision: number): Promise<void> => {\n        const prior = (() => {\n          try { return markdownBuffer.finish(); }\n          catch (error) { return throwMarkdownConsistencyError(error); }\n        })();\n        if (prior.delta) emitMarkdownDelta(prior.delta);\n        if (prior.markdown) {\n          completedSteerAnswers.push(prior.markdown);\n          pendingSteerSeparator = true;\n        }\n        const revisionAdvance = Math.max(1, revision - handledSteerRevision);\n        const steered = await this.waitForSteeredAssistantTurn(\n          page,\n          knownResponseIdentities,\n          revisionAdvance,\n          deadline,\n          turn.abortSignal,\n        );\n        responseTurn = steered.binding;\n        submissionBaseline = steered.baseline;\n        knownResponseIdentities = new Set(steered.state.responseIdentities);\n        handledSteerRevision = revision;\n        completionTracker = new ChatGptCompletionTracker();\n        visibleTrace = new ChatGptVisibleTraceTracker();\n        markdownBuffer = new ChatGptMarkdownBuffer();\n        checkpointStream = turn.captureLunaCheckpoint ? new ChatGptLunaCheckpointStream() : undefined;\n        domHealthTracker = new ChatGptTurnDomHealthTracker();\n        stoppedThinkingTracker = new ChatGptStoppedThinkingTracker();\n        responseDomCache = {};\n        completionFenceRevision = undefined;\n        capturedResponse = false;\n        loggedCompletionWait = false;\n        sawRunning = false;\n        sentAt = Date.now();\n        consecutiveObservationRebinds = 0;\n        internalObservationFaults = 0;\n        await diagnostics.capture(page, `codex-steer-${revision}-accepted`);\n      };''', 1)

          check_anchor = '''        await throwIfChatGptSessionFailureAlert(page);\n        await throwIfChatGptTerminalErrorAlert(responseTurn.locator);\n\n        if (mode.localTools && await resolveChatGptToolConfirmation('''
          check_replacement = '''        await throwIfChatGptSessionFailureAlert(page);\n        const pendingSteerRevision = await this.readCodexSteerRevision(page);\n        if (pendingSteerRevision > handledSteerRevision) {\n          await applyCodexSteer(pendingSteerRevision);\n          continue;\n        }\n        await throwIfChatGptTerminalErrorAlert(responseTurn.locator);\n\n        if (mode.localTools && await resolveChatGptToolConfirmation('''
          if text.count(check_anchor) != 1:
              raise SystemExit("browser-worker.ts: steer pre-observation anchor not found")
          text = text.replace(check_anchor, check_replacement, 1)

          completion_anchor = '''          if (completionReady) {\n            if (turn.completionFence) {'''
          completion_replace = '''          if (completionReady) {\n            const completionSteerRevision = await this.readCodexSteerRevision(page);\n            if (completionSteerRevision > handledSteerRevision) {\n              await applyCodexSteer(completionSteerRevision);\n              continue;\n            }\n            if (turn.completionFence) {'''
          if text.count(completion_anchor) != 1:
              raise SystemExit("browser-worker.ts: completion steer anchor not found")
          text = text.replace(completion_anchor, completion_replace, 1)

          final_old = '''            if (checkpointStream) {\n              const completed = checkpointStream.finishOptional(snapshot.visibleText);\n              if (completed.visibleRemainder) turn.onTextDelta(completed.visibleRemainder);\n              if (completed.captured) turn.onLunaCheckpoint!(completed.captured);\n              else console.warn(`[chatgpt-web] browser turn ${turn.traceId} completed without a Luna rolling checkpoint; preserving full native history`);\n              finalText = completed.answer;\n            } else {\n              finalText = final.markdown;\n            }\n            break;'''
          final_new = '''            let currentFinalText: string;\n            if (checkpointStream) {\n              const completed = checkpointStream.finishOptional(snapshot.visibleText);\n              if (completed.visibleRemainder) {\n                if (pendingSteerSeparator) {\n                  turn.onTextDelta("\\n\\n");\n                  pendingSteerSeparator = false;\n                }\n                turn.onTextDelta(completed.visibleRemainder);\n              }\n              if (completed.captured) turn.onLunaCheckpoint!(completed.captured);\n              else console.warn(`[chatgpt-web] browser turn ${turn.traceId} completed without a Luna rolling checkpoint; preserving full native history`);\n              currentFinalText = completed.answer;\n            } else {\n              currentFinalText = final.markdown;\n            }\n            finalText = [...completedSteerAnswers, currentFinalText].filter(Boolean).join("\\n\\n");\n            break;'''
          if text.count(final_old) != 1:
              raise SystemExit("browser-worker.ts: final text anchor not found")
          text = text.replace(final_old, final_new, 1)
          p.write_text(text)

          # Adapter subscribes to immediate Codex steer logs and suppresses the later canonical replay.
          path = "src/adapters/chatgpt-web/index.ts"
          p = Path(path)
          text = p.read_text()
          text = text.replace(
              'import { handoffLauncherTurnForSteering, releaseLauncherRetainedConversation } from "../../launcher-browser-host";',
              'import { handoffLauncherTurnForSteering, releaseLauncherRetainedConversation, steerLauncherTurn } from "../../launcher-browser-host";',
              1,
          )
          import_anchor = '''import {\n  chatGptConversationKey,\n  retainedConversationResumeRequest,\n  retainedConversationSteeringRequest,\n} from "./conversation-key";'''
          import_new = import_anchor + '''\nimport {\n  codexSteeringLogWatcher,\n  codexUserRevisionText,\n  consumeInjectedCodexSteerReplay,\n  markInjectedCodexSteersSettled,\n  recordInjectedCodexSteer,\n} from "./codex-steering-watch";'''
          if text.count(import_anchor) != 1:
              raise SystemExit("index.ts: conversation import anchor not found")
          text = text.replace(import_anchor, import_new, 1)

          helper_anchor = '''    const steeringHandoffFor = (cancelBrowser: () => void): (() => Promise<string>) | undefined => ('''
          helper = '''    const armImmediateCodexSteering = (physicalSettlement: Promise<void>): void => {\n      if (parsed._compactionRequest\n        || !retainedLauncherDescriptor\n        || !identity.threadId\n        || !identity.turnId) return;\n      const threadId = identity.threadId;\n      const turnId = identity.turnId;\n      const unsubscribe = codexSteeringLogWatcher.subscribe({\n        threadId,\n        turnId,\n        onSteer: async submission => {\n          const receipt = await steerLauncherTurn(retainedLauncherDescriptor, {\n            traceId,\n            logId: submission.logId,\n            text: submission.text,\n          });\n          if (!receipt.duplicate) recordInjectedCodexSteer(submission);\n        },\n      });\n      void physicalSettlement.finally(() => {\n        unsubscribe();\n        markInjectedCodexSteersSettled(threadId, turnId);\n      });\n    };\n    const steeringHandoffFor = (cancelBrowser: () => void): (() => Promise<string>) | undefined => ('''
          if text.count(helper_anchor) != 1:
              raise SystemExit("index.ts: steering helper anchor not found")
          text = text.replace(helper_anchor, helper, 1)
          # Arm both browser runtime variants immediately after their cancellable wrapper is created.
          needle = '''      })), browserAbort);\n      return {\n        mode: "read-only",'''
          replacement = '''      })), browserAbort);\n      armImmediateCodexSteering(browserTurn.physicalSettlement);\n      return {\n        mode: "read-only",'''
          if text.count(needle) != 1:
              raise SystemExit("index.ts: read-only browser wrapper anchor not found")
          text = text.replace(needle, replacement, 1)
          needle = '''    })), browserAbort);\n    void browserTurn.browser.catch(error => {'''
          replacement = '''    })), browserAbort);\n    armImmediateCodexSteering(browserTurn.physicalSettlement);\n    void browserTurn.browser.catch(error => {'''
          if text.count(needle) != 1:
              raise SystemExit("index.ts: tools browser wrapper anchor not found")
          text = text.replace(needle, replacement, 1)

          no_op_anchor = '''        const turnCapabilities = parsed._compactionRequest\n          ? { ...configuredCapabilities, localToolsEnabled: false }\n          : configuredCapabilities;\n        const mode = resolveChatGptWebModelMode(parsed.modelId, parsed.options.reasoning, turnCapabilities);'''
          no_op = '''        const turnCapabilities = parsed._compactionRequest\n          ? { ...configuredCapabilities, localToolsEnabled: false }\n          : configuredCapabilities;\n        const immediateSteerIdentity = extractChatGptTurnIdentity(parsed);\n        if (!parsed._compactionRequest && immediateSteerIdentity.threadId && immediateSteerIdentity.turnId) {\n          const revisionText = codexUserRevisionText(extractChatGptTurnUserRevision(parsed));\n          if (revisionText && consumeInjectedCodexSteerReplay(\n            immediateSteerIdentity.threadId,\n            immediateSteerIdentity.turnId,\n            revisionText,\n          )) {\n            console.info(`[chatgpt-web] consumed canonical Codex replay for an already mirrored steer (textChars=${revisionText.length})`);\n            emitBrowserCompletion(\n              { type: "final", answer: "" },\n              estimateChatGptWebUsage(currentUsageInput(parsed), { answer: "", reasoning: [] }, turnCapabilities),\n              emit,\n            );\n            return;\n          }\n        }\n        const mode = resolveChatGptWebModelMode(parsed.modelId, parsed.options.reasoning, turnCapabilities);'''
          if text.count(no_op_anchor) != 1:
              raise SystemExit("index.ts: no-op replay anchor not found")
          text = text.replace(no_op_anchor, no_op, 1)
          # extractChatGptTurnUserRevision is now needed directly here.
          text = text.replace(
              'import { extractChatGptTurnEnvironment, extractChatGptTurnIdentity } from "./environment";',
              'import { extractChatGptTurnEnvironment, extractChatGptTurnIdentity, extractChatGptTurnUserRevision } from "./environment";',
              1,
          )
          p.write_text(text)
          PY
          git diff --check

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Validate patch
        run: |
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/launcher-browser-host.ts launcher/electron/control-server.cjs src/adapters/chatgpt-web/browser-worker.ts src/adapters/chatgpt-web/index.ts
          git diff --cached --check
          git commit -m "Forward native Codex steer submissions into live Web turns"
          git push origin HEAD:fix/codex-steer-button-live-web
