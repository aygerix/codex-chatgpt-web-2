name: One-shot stale branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-stale-branches:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Delete merged and superseded remote branches
        run: |
          git push origin --delete \
            experiment/native-goal-turn-scoped-capabilities \
            fix/codex-steer-button-live-web \
            fix/completion-fallback-without-copy-action \
            fix/defer-token-retirement-until-physical-settlement \
            fix/live-codex-steering-regular-only \
            fix/nonmonotonic-final-dom-ranges \
            fix/pro-capability-personalized-probe \
            fix/regular-chats-scroll-unlock \
            fix/repair-capability-structural-personalization \
            fix/retained-compaction-observation-timeout \
            fix/subagent-parent-turn-lineage \
            fix/temp-personalization-preflight \
            fix/tool-boundary-recovery-aware-timeout \
            hide-conversation-history-rate-limit-modal
