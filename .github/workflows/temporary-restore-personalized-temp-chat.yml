name: Temporary restore personalized Temporary Chat

on:
  push:
    branches:
      - fix/nonmonotonic-final-dom-ranges

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/nonmonotonic-final-dom-ranges
      - name: Restore Temporary Chat surface and personalization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} occurrences, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          # Shared browser surface contract: Temporary Chat only.
          p = Path("src/chatgpt-session.ts")
          text = p.read_text()
          old = '''export const CHATGPT_REGULAR_CHAT_URL = "https://chatgpt.com/";\nexport const CHATGPT_NEW_CHAT_URL = CHATGPT_REGULAR_CHAT_URL;\n\n/** Legacy import name retained for the browser worker; it now always means regular ChatGPT. */\nexport const CHATGPT_TEMPORARY_CHAT_URL = CHATGPT_NEW_CHAT_URL;'''
          new = '''export const CHATGPT_TEMPORARY_CHAT_URL = "https://chatgpt.com/?temporary-chat=true";'''
          if old not in text:
              raise SystemExit("src/chatgpt-session.ts: regular-chat constant block not found")
          text = text.replace(old, new, 1)
          old = '''/** Legacy assertion name retained for the worker; only regular/history-backed chats are valid. */\nexport async function assertTemporaryChatPage(page: Page): Promise<void> {\n  const url = new URL(page.url());\n  const expected = new URL(CHATGPT_NEW_CHAT_URL);\n  if (url.origin !== expected.origin || url.searchParams.has("temporary-chat")) {\n    throw new Error(`ChatGPT left the regular chat surface (${page.url()})`);\n  }\n}'''
          new = '''export async function assertTemporaryChatPage(page: Page): Promise<void> {\n  const url = new URL(page.url());\n  const expected = new URL(CHATGPT_TEMPORARY_CHAT_URL);\n  if (url.origin !== expected.origin\n    || url.pathname !== expected.pathname\n    || url.searchParams.get("temporary-chat") !== "true") {\n    throw new Error(`ChatGPT left the isolated Temporary Chat surface (${page.url()})`);\n  }\n}'''
          if old not in text:
              raise SystemExit("src/chatgpt-session.ts: regular surface assertion not found")
          p.write_text(text.replace(old, new, 1))

          # Every fresh browser turn must be Personalized before use, including browser-only turns.
          p = Path("src/adapters/chatgpt-web/browser-worker.ts")
          text = p.read_text()
          old = '''    await assertAuthenticatedChatGptPage(page);\n    await assertTemporaryChatPage(page);\n    await captureDiagnostic?.("session-verified");\n    return composer;'''
          new = '''    await assertAuthenticatedChatGptPage(page);\n    await assertTemporaryChatPage(page);\n    await ensureChatGptPersonalizedConnectorAccess(page, captureDiagnostic);\n    await captureDiagnostic?.("personalization-verified");\n    await captureDiagnostic?.("session-verified");\n    return await this.activeComposer(page);'''
          if old not in text:
              raise SystemExit("browser-worker.ts: Temporary Chat preparation tail not found")
          text = text.replace(old, new, 1)
          text = text.replace('''    regular: true;''', '''    temporary: true;''')
          text = text.replace('''{ authenticated: true, regular: true, url }''', '''{ authenticated: true, temporary: true, url }''')
          text = text.replace('''{ authenticated: true, regular: true, url, ...capabilities }''', '''{ authenticated: true, temporary: true, url, ...capabilities }''')
          p.write_text(text)

          # Electron-owned browser surfaces use the same Temporary Chat contract.
          p = Path("launcher/electron/browser-host.cjs")
          text = p.read_text()
          text = text.replace('const CHATGPT_HOME_URL = "https://chatgpt.com/";', 'const CHATGPT_TEMPORARY_CHAT_URL = "https://chatgpt.com/?temporary-chat=true";')
          text = text.replace('CHATGPT_HOME_URL', 'CHATGPT_TEMPORARY_CHAT_URL')
          text = text.replace('isRegularChatUrl', 'isTemporaryChatUrl')
          old = '''  return parsed.origin === CHATGPT_ORIGIN\n    && !parsed.searchParams.has("temporary-chat");'''
          new = '''  return parsed.origin === CHATGPT_ORIGIN\n    && parsed.pathname === "/"\n    && parsed.searchParams.get("temporary-chat") === "true";'''
          if old not in text:
              raise SystemExit("browser-host.cjs: regular URL predicate body not found")
          text = text.replace(old, new, 1)
          old = '''          regular: actualUrl.origin === expectedUrl.origin\n            && !actualUrl.searchParams.has("temporary-chat"),'''
          new = '''          temporary: actualUrl.origin === expectedUrl.origin\n            && actualUrl.pathname === expectedUrl.pathname\n            && actualUrl.searchParams.get("temporary-chat") === "true",'''
          if old not in text:
              raise SystemExit("browser-host.cjs: regular auth surface evidence not found")
          text = text.replace(old, new, 1)
          text = text.replace('regular: false', 'temporary: false')
          text = text.replace('result.regular', 'result.temporary')
          text = text.replace('inspected.regular', 'inspected.temporary')
          p.write_text(text)

          # Unit expectations for the shared surface.
          p = Path("tests/chatgpt-session.test.ts")
          text = p.read_text()
          text = text.replace('''  CHATGPT_NEW_CHAT_URL,\n  CHATGPT_REGULAR_CHAT_URL,''', '''  CHATGPT_TEMPORARY_CHAT_URL,''')
          old = '''test("regular history-backed chats are the only surface", () => {\n  expect(CHATGPT_NEW_CHAT_URL).toBe(CHATGPT_REGULAR_CHAT_URL);\n  expect(CHATGPT_NEW_CHAT_URL).toBe("https://chatgpt.com/");\n});'''
          new = '''test("isolated Temporary Chat is the only turn surface", () => {\n  expect(CHATGPT_TEMPORARY_CHAT_URL).toBe("https://chatgpt.com/?temporary-chat=true");\n});'''
          if old not in text:
              raise SystemExit("chatgpt-session.test.ts: regular-only test not found")
          p.write_text(text.replace(old, new, 1))

          # Launcher tests follow the restored Temporary Chat evidence names and URL.
          p = Path("launcher/tests/browser-host.test.cjs")
          text = p.read_text()
          text = text.replace('isRegularChatUrl', 'isTemporaryChatUrl')
          text = text.replace('''test("smoke preserves an already-hydrated regular ChatGPT page", () => {\n  assert.equal(isTemporaryChatUrl("https://chatgpt.com/"), true);\n  assert.equal(isTemporaryChatUrl("https://chatgpt.com/?temporary-chat=false"), false);\n  assert.equal(isTemporaryChatUrl("https://chatgpt.com/c/abc?temporary-chat=true"), false);\n  assert.equal(isTemporaryChatUrl("not a url"), false);\n});''', '''test("smoke preserves only an already-hydrated Temporary Chat page", () => {\n  assert.equal(isTemporaryChatUrl("https://chatgpt.com/?temporary-chat=true"), true);\n  assert.equal(isTemporaryChatUrl("https://chatgpt.com/"), false);\n  assert.equal(isTemporaryChatUrl("https://chatgpt.com/?temporary-chat=false"), false);\n  assert.equal(isTemporaryChatUrl("https://chatgpt.com/c/abc?temporary-chat=true"), false);\n  assert.equal(isTemporaryChatUrl("not a url"), false);\n});''')
          text = text.replace('regular: true', 'temporary: true')
          text = text.replace('regular: false', 'temporary: false')
          text = text.replace('''url: "https://chatgpt.com/",\n          solAvailable''', '''url: "https://chatgpt.com/?temporary-chat=true",\n          solAvailable''')
          text = text.replace('''url: "https://chatgpt.com/",\n    solAvailable''', '''url: "https://chatgpt.com/?temporary-chat=true",\n    solAvailable''')
          text = text.replace('''value: { authenticated: true, temporary: true, url: "https://chatgpt.com/" }''', '''value: { authenticated: true, temporary: true, url: "https://chatgpt.com/?temporary-chat=true" }''')
          # Challenge recovery should reload the configured Temporary Chat home surface.
          text = text.replace('''["loadURL", "https://chatgpt.com/"],''', '''["loadURL", "https://chatgpt.com/?temporary-chat=true"],''')
          p.write_text(text)

          # Contract test: preparation itself must enforce personalization, not only connector selection.
          p = Path("tests/browser-worker-contract.test.ts")
          text = p.read_text()
          anchor = '''  expect(workerSource).not.toMatch(/\\bclipboard\\b|pbcopy|pbpaste/i);\n});'''
          replacement = '''  expect(workerSource).not.toMatch(/\\bclipboard\\b|pbcopy|pbpaste/i);\n  const prepareTemporaryChatSurface = workerSource.slice(\n    workerSource.indexOf("  private async prepareTemporaryChatSurface("),\n    workerSource.indexOf("  private async waitForTurnDomMutation("),\n  );\n  expect(prepareTemporaryChatSurface).toContain("await assertTemporaryChatPage(page)");\n  expect(prepareTemporaryChatSurface).toContain("await ensureChatGptPersonalizedConnectorAccess(page, captureDiagnostic)");\n  expect(prepareTemporaryChatSurface).toContain('await captureDiagnostic?.("personalization-verified")');\n});'''
          if anchor not in text:
              raise SystemExit("browser-worker-contract.test.ts: orchestration test anchor not found")
          p.write_text(text.replace(anchor, replacement, 1))

          # Fail the patch if regular-chat surface code remains in the files that own browser routing.
          owners = [
              Path("src/chatgpt-session.ts"),
              Path("src/adapters/chatgpt-web/browser-worker.ts"),
              Path("launcher/electron/browser-host.cjs"),
          ]
          for owner in owners:
              source = owner.read_text()
              if "CHATGPT_REGULAR_CHAT_URL" in source or "isRegularChatUrl" in source:
                  raise SystemExit(f"{owner}: stale regular-chat surface symbol remains")
          PY

      - name: Commit restored surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/chatgpt-session.ts src/adapters/chatgpt-web/browser-worker.ts launcher/electron/browser-host.cjs tests/chatgpt-session.test.ts tests/browser-worker-contract.test.ts launcher/tests/browser-host.test.cjs
          git diff --cached --check
          git commit -m "Restore personalized Temporary Chat turns"
          git push origin HEAD:fix/nonmonotonic-final-dom-ranges
