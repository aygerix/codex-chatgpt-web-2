name: Temporary retained compaction observation fix

on:
  push:
    branches:
      - fix/retained-compaction-observation-timeout

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/retained-compaction-observation-timeout
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Patch retained compaction observation recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}")
              p.write_text(text.replace(old, new, 1))

          path = "src/adapters/chatgpt-web/browser-worker.ts"
          old = '''       } catch (error) {\n        // Only a defect in this worker is retried here. Every deliberate signal — adapter errors,\n        // aborts, closed tabs, DOM-health verdicts — still fails the turn immediately.\n        // Retry only faults raised while reading the page. Once observation succeeded, a\n        // TypeError belongs to a consumer - Markdown buffering, text/trace callbacks, checkpoint\n        // capture - and retrying it would rerun an iteration whose side effects already happened.\n        if (!(error instanceof TypeError) || observedThisIteration) throw error;'''
          new = '''       } catch (error) {\n        // A bounded Playwright observation timeout means the existing Electron renderer stopped\n        // answering one read; it does not prove that the retained ChatGPT turn failed. Rebind the\n        // same launcher-owned page before any iteration side effect has happened, exactly as the\n        // missing-response reconciliation path does above. This is especially important for the\n        // tool-only retained compaction handoff, whose assistant DOM can be transiently busy while\n        // the one-shot control call is being accepted.\n        if (\n          error instanceof ChatGptBrowserObservationTimeoutError\n          && !observedThisIteration\n          && launcherSurfaceId\n        ) {\n          consecutiveObservationRebinds += 1;\n          if (consecutiveObservationRebinds > MAX_CHATGPT_BROWSER_PAGE_REBINDS) {\n            throw new Error(\n              `ChatGPT browser DOM remained unresponsive after ${MAX_CHATGPT_BROWSER_PAGE_REBINDS} same-page rebinds`,\n              { cause: error },\n            );\n          }\n          await rebindLauncherPage(consecutiveObservationRebinds, error);\n          submissionBaseline = {\n            ...submissionBaseline,\n            userTurns: page.locator(CHATGPT_USER_TURN_SELECTOR),\n            responseTurns: page.locator(CHATGPT_ASSISTANT_TURN_SELECTOR),\n            domCache: {},\n          };\n          responseTurn = {\n            ...responseTurn,\n            locator: page.locator(`[data-testid=${JSON.stringify(responseTurn.identity)}]`),\n          };\n          responseDomCache = {};\n          internalObservationFaults = 0;\n          await diagnostics.capture(page, "response-page-rebound-after-observation-timeout");\n          continue;\n        }\n        // Only a defect in this worker is retried here. Every deliberate signal — adapter errors,\n        // aborts, closed tabs, DOM-health verdicts — still fails the turn immediately.\n        // Retry only faults raised while reading the page. Once observation succeeded, a\n        // TypeError belongs to a consumer - Markdown buffering, text/trace callbacks, checkpoint\n        // capture - and retrying it would rerun an iteration whose side effects already happened.\n        if (!(error instanceof TypeError) || observedThisIteration) throw error;'''
          once(path, old, new)

          test_path = "tests/browser-worker-contract.test.ts"
          p = Path(test_path)
          text = p.read_text()
          anchor = '''  expect(workerSource).toContain("completionSteerRevision > handledSteerRevision");\n'''
          addition = '''  expect(workerSource).toContain("completionSteerRevision > handledSteerRevision");\n  const observationCatch = workerSource.slice(\n    workerSource.indexOf("       } catch (error) {", workerSource.indexOf("for (;;) {", workerSource.indexOf("let completionFenceRevision"))),\n    workerSource.indexOf("      if (this.context && this.config.browserHost", workerSource.indexOf("let completionFenceRevision")),\n  );\n  expect(observationCatch).toContain("error instanceof ChatGptBrowserObservationTimeoutError");\n  expect(observationCatch).toContain("!observedThisIteration");\n  expect(observationCatch).toContain("await rebindLauncherPage(consecutiveObservationRebinds, error)");\n  expect(observationCatch).toContain("response-page-rebound-after-observation-timeout");\n  expect(observationCatch.indexOf("error instanceof ChatGptBrowserObservationTimeoutError")).toBeLessThan(\n    observationCatch.indexOf("if (!(error instanceof TypeError) || observedThisIteration) throw error"),\n  );\n'''
          if anchor not in text:
              raise SystemExit("test anchor not found")
          p.write_text(text.replace(anchor, addition, 1))
          PY
          git diff --check
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Validate exact patched tree
        run: |
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temporary-retained-compaction-observation-fix.yml
          git add src/adapters/chatgpt-web/browser-worker.ts tests/browser-worker-contract.test.ts
          git commit -m "Recover retained compaction from stalled DOM observations"
          git push origin HEAD:fix/retained-compaction-observation-timeout
