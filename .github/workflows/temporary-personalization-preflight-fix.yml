name: Temporary personalization preflight fix

on:
  push:
    branches:
      - fix/temp-personalization-preflight

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/temp-personalization-preflight
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Patch personalization gate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          once(
              "src/adapters/chatgpt-web/browser-worker.ts",
              '''    await assertTemporaryChatPage(page);\n    await ensureChatGptPersonalizedConnectorAccess(page, captureDiagnostic);\n    await captureDiagnostic?.("personalization-verified");\n    await captureDiagnostic?.("session-verified");\n    return await this.activeComposer(page);''',
              '''    await assertTemporaryChatPage(page);\n    // Surface preparation proves only authentication + Temporary Chat. Personalization is\n    // connector-specific and ChatGPT does not expose its control on every fresh Temporary Chat.\n    // Tool-capable turns prove/enable it inside selectConnector(), where the configured connector\n    // itself is authoritative evidence when the UI control is absent. Browser-only turns must not\n    // fail merely because that optional control was not rendered.\n    await captureDiagnostic?.("session-verified");\n    return await this.activeComposer(page);''',
          )

          once(
              "tests/browser-worker-contract.test.ts",
              '''  expect(prepareTemporaryChatSurface).toContain("await assertTemporaryChatPage(page)");\n  expect(prepareTemporaryChatSurface).toContain("await ensureChatGptPersonalizedConnectorAccess(page, captureDiagnostic)");\n  expect(prepareTemporaryChatSurface).toContain('await captureDiagnostic?.("personalization-verified")');''',
              '''  expect(prepareTemporaryChatSurface).toContain("await assertTemporaryChatPage(page)");\n  expect(prepareTemporaryChatSurface).not.toContain("ensureChatGptPersonalizedConnectorAccess(");\n  const selectConnector = workerSource.slice(\n    workerSource.indexOf("  private async selectConnector("),\n    workerSource.indexOf("  private async attachPrompt("),\n  );\n  expect(selectConnector).toContain("await ensureChatGptPersonalizedConnectorAccess(");\n  expect(selectConnector).toContain("proveConfiguredConnectorAccess");''',
          )
          PY
          git diff --check
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Validate exact patched tree
        run: |
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temporary-personalization-preflight-fix.yml
          git add src/adapters/chatgpt-web/browser-worker.ts tests/browser-worker-contract.test.ts
          git commit -m "Scope Temporary Chat personalization to connector turns"
          git push origin HEAD:fix/temp-personalization-preflight
