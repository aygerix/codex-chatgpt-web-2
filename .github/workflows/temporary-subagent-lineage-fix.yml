name: Temporary subagent parent-turn lineage fix

on:
  push:
    branches:
      - fix/subagent-parent-turn-lineage

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/subagent-parent-turn-lineage
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Patch authenticated parent-turn lineage
        run: |
          python3 .github/scripts/patch_subagent_lineage.py
          git diff --check
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Validate exact patched tree
        run: |
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temporary-subagent-lineage-fix.yml
          git rm -f .github/scripts/patch_subagent_lineage.py
          if [ -f .github/workflows/temporary-live-steer-final-gate.yml ]; then
            git rm -f .github/workflows/temporary-live-steer-final-gate.yml
          fi
          git add src/adapters/chatgpt-web/environment.ts tests/environment.test.ts
          git commit -m "Accept authenticated parent-turn lineage for Web subagents"
          git push origin HEAD:fix/subagent-parent-turn-lineage
