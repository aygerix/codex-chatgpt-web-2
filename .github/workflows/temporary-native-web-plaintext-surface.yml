name: Temporary active steer replay validation

on:
  push:
    branches:
      - experiment/native-goal-turn-scoped-capabilities

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Patch active mirrored steer replay
        run: python3 .github/scripts/patch-active-steer-replay.py
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Validate steer lifecycle and full runtime
        run: |
          bun test tests/codex-steering-watch.test.ts tests/chatgpt-steering-lifecycle.test.ts
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit validated steer replay fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+aygerix[bot]@users.noreply.github.com'
          git add \
            src/adapters/chatgpt-web/codex-steering-watch.ts \
            src/adapters/chatgpt-web/turn-execution.ts \
            src/adapters/chatgpt-web/index.ts \
            tests/codex-steering-watch.test.ts \
            tests/chatgpt-steering-lifecycle.test.ts
          git commit -m 'Reuse active Web session for mirrored Codex steer replay'
          git push origin HEAD:experiment/native-goal-turn-scoped-capabilities
