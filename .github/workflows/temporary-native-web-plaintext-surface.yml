name: Temporary native Web plaintext surface

on:
  push:
    branches:
      - experiment/native-goal-turn-scoped-capabilities

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Patch native Web plaintext collaboration surface
        run: |
          python3 .github/scripts/patch-native-web-plaintext-surface.py
          python3 .github/scripts/refine-native-web-plaintext-surface.py
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd launcher && bun install --frozen-lockfile)
      - name: Validate native Web bridge
        run: |
          bun test tests/native-passthrough.test.ts
          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run build
          bun run smoke
      - name: Commit validated native Web plaintext surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+aygerix[bot]@users.noreply.github.com'
          git add src/native-passthrough.ts tests/native-passthrough.test.ts
          git commit -m 'Add plaintext native-to-Web collaboration surface'
          git push origin HEAD:experiment/native-goal-turn-scoped-capabilities
