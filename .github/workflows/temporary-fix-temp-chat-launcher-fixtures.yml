name: Temporary fix Temporary Chat launcher fixtures

on:
  push:
    branches:
      - fix/nonmonotonic-final-dom-ranges

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/nonmonotonic-final-dom-ranges
      - name: Repair stale regular-chat fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('launcher/tests/browser-host.test.cjs')
          text = p.read_text()
          temp = 'https://chatgpt.com/?temporary-chat=true'

          def once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          # Cloudflare recovery reloads the current owned document; make that owned document Temporary Chat.
          once('''        getURL: () => "https://chatgpt.com/",\n        isDestroyed: () => false,\n        loadURL: async (url) => calls.push(["loadURL", url]),''',
               f'''        getURL: () => "{temp}",\n        isDestroyed: () => false,\n        loadURL: async (url) => calls.push(["loadURL", url]),''')

          # Logout now returns the owned browser to Temporary Chat before proving it signed out.
          once('''  assert.deepEqual(calls[4], ["loadURL", "https://chatgpt.com/"]);''',
               f'''  assert.deepEqual(calls[4], ["loadURL", "{temp}"]);''')

          # OAuth handoff is re-proved on the primary Personalized Temporary Chat surface.
          once('''test("OAuth completion is re-proved on the primary regular ChatGPT surface before login succeeds", async () => {''',
               '''test("OAuth completion is re-proved on the primary Temporary Chat surface before login succeeds", async () => {''')
          once('''        getURL: () => primaryReady\n          ? "https://chatgpt.com/"\n          : "https://chatgpt.com/auth/login",''',
               f'''        getURL: () => primaryReady\n          ? "{temp}"\n          : "https://chatgpt.com/auth/login",''')
          once('''          regular: primaryReady,''', '''          temporary: primaryReady,''')
          once('''          url: primaryReady\n            ? "https://chatgpt.com/"\n            : "https://chatgpt.com/auth/login",''',
               f'''          url: primaryReady\n            ? "{temp}"\n            : "https://chatgpt.com/auth/login",''')
          once('''          assert.equal(url, "https://chatgpt.com/");''',
               f'''          assert.equal(url, "{temp}");''')
          once('''  assert.equal(result.url, "https://chatgpt.com/");\n});\n\ntest("a successful primary login redirect is re-proved on regular ChatGPT before login completes", async () => {''',
               f'''  assert.equal(result.url, "{temp}");\n}});\n\ntest("a successful primary login redirect is re-proved on Temporary Chat before login completes", async () => {{''')

          # A regular post-login redirect is not yet the required turn surface: it must transition to Temporary Chat.
          once('''          regular: currentUrl === "https://chatgpt.com/",''',
               f'''          temporary: currentUrl === "{temp}",''')
          once('''  assert.deepEqual(loadedUrls, []);\n  assert.equal(result.authenticated, true);\n  assert.equal(result.url, "https://chatgpt.com/");''',
               f'''  assert.deepEqual(loadedUrls, ["{temp}"]);\n  assert.equal(result.authenticated, true);\n  assert.equal(result.url, "{temp}");''')

          # Session refresh always targets the exact Temporary Chat surface.
          once('''    ["load", "https://chatgpt.com/"],''',
               f'''    ["load", "{temp}"],''')

          # Concurrent refresh starts on the exact target so its probe is entered synchronously.
          title = 'test("concurrent launcher session refresh requests share one browser operation", async () => {'
          start = text.index(title)
          end = text.index('\n});', start) + len('\n});')
          block = text[start:end]
          old = '''      getURL: () => "https://chatgpt.com/",\n      loadURL: async () => {},'''
          if block.count(old) != 1:
              raise SystemExit(f'concurrent refresh fixture did not expose one expected URL block: {block.count(old)}')
          block = block.replace(old, f'''      getURL: () => "{temp}",\n      loadURL: async () => {{}},''', 1)
          text = text[:start] + block + text[end:]

          text = text.replace(
              'test("launcher authentication requires the regular ChatGPT composer and complete server session",',
              'test("launcher authentication requires the Temporary Chat composer and complete server session",',
          )

          p.write_text(text)
          PY
          git diff --check
      - name: Commit fixture repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/tests/browser-host.test.cjs
          git commit -m "Align launcher tests with Temporary Chat surface"
          git push origin HEAD:fix/nonmonotonic-final-dom-ranges
